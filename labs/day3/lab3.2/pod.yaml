apiVersion: v1
kind: Pod
metadata:
  name: security-lockdown
  namespace: ckad-labs
  labels: {app: security-lockdown, lab: "3.2"}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  initContainers:
    - name: config-init
      image: busybox:1.37
      command: [sh, -c]
      args:
        - |
          sed "s/PUBLIC_PORT/8080/g; s/APP_PORT/18080/g" /templates/nginx.conf.template > /generated/nginx.conf
          touch /logs/access.log
          id -u > /evidence/uid
          if touch /tmp/rootfs-write-test 2>/dev/null; then
            echo writable > /evidence/rootfs
            exit 1
          fi
          echo read-only > /evidence/rootfs
      securityContext: &locked-down
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources: {requests: {cpu: 5m, memory: 4Mi}, limits: {cpu: 25m, memory: 16Mi}}
      volumeMounts:
        - {name: proxy-template, mountPath: /templates, readOnly: true}
        - {name: generated-config, mountPath: /generated}
        - {name: shared-logs, mountPath: /logs}
        - {name: security-evidence, mountPath: /evidence}
  containers:
    - name: app
      image: ckad/traffic-ingest:local
      imagePullPolicy: IfNotPresent
      env:
        - {name: HTTP_ADDR, value: ":18080"}
      ports: [{name: app-http, containerPort: 18080}]
      securityContext: *locked-down
      resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
    - name: log-sidecar
      image: busybox:1.37
      command: [sh, -c, 'tail -n+1 -F /logs/access.log']
      securityContext: *locked-down
      resources: {requests: {cpu: 5m, memory: 4Mi}, limits: {cpu: 25m, memory: 16Mi}}
      volumeMounts:
        - {name: shared-logs, mountPath: /logs, readOnly: true}
        - {name: security-evidence, mountPath: /evidence, readOnly: true}
    - name: nginx-ambassador
      image: nginxinc/nginx-unprivileged:1.27-alpine
      command: [nginx, -g, "daemon off;", -c, /config/nginx.conf]
      ports: [{name: http, containerPort: 8080}]
      securityContext: *locked-down
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
      volumeMounts:
        - {name: generated-config, mountPath: /config, readOnly: true}
        - {name: shared-logs, mountPath: /var/log/shared}
        - {name: nginx-tmp, mountPath: /tmp}
  volumes:
    - name: proxy-template
      configMap: {name: pod-pattern-config, items: [{key: nginx.conf.template, path: nginx.conf.template}]}
    - {name: generated-config, emptyDir: {}}
    - {name: shared-logs, emptyDir: {}}
    - {name: security-evidence, emptyDir: {}}
    - {name: nginx-tmp, emptyDir: {}}
