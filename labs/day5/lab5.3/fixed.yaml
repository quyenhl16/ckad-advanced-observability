apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-app
  namespace: ckad-labs
  labels: {app: triage-app, lab: "5.3"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: triage-app}
  template:
    metadata:
      labels: {app: triage-app, lab: "5.3"}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: ckad/traffic-ingest:local
          imagePullPolicy: IfNotPresent
          env: [{name: HTTP_ADDR, value: ":8080"}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 24Mi}
            limits: {cpu: 200m, memory: 96Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: triage-app
  namespace: ckad-labs
  labels: {lab: "5.3"}
spec:
  selector: {app: triage-app}
  ports:
    - {name: http, port: 8080, targetPort: http}
