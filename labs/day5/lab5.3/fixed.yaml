apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-app
  namespace: ckad-labs
  labels: {app: triage-app, lab: "5.3"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: triage-app}
  template:
    metadata:
      labels: {app: triage-app, lab: "5.3"}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: busybox:1.37
          command: [sh, -c, 'mkdir -p /www && echo triage-fixed > /www/index.html && exec httpd -f -p 8080 -h /www']
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 5m, memory: 4Mi}
            limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: triage-app
  namespace: ckad-labs
  labels: {lab: "5.3"}
spec:
  selector: {app: triage-app}
  ports:
    - {name: http, port: 8080, targetPort: http}
