apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-app
  namespace: ckad-labs
  labels: {app: triage-app, lab: "5.3"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: triage-app}
  template:
    metadata:
      labels: {app: triage-app-wrong, lab: "5.3"}
    spec:
      containers:
        - name: app
          image: INVALID_IMAGE_NAME
          ports: [{name: http, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: triage-app
  namespace: ckad-labs
  labels: {lab: "5.3"}
spec:
  selector: {app: triage-app}
  ports:
    - {name: http, port: 8080, targetPort: web}
