apiVersion: v1
kind: Pod
metadata:
  name: cli-observer
  namespace: ckad-labs
  labels: {app: cli-observer, lab: "5.2"}
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  securityContext: {fsGroup: 65532}
  containers:
    - name: app
      image: ckad/traffic-ingest:local
      imagePullPolicy: IfNotPresent
      env: [{name: HTTP_ADDR, value: ":8080"}]
      ports: [{name: http, containerPort: 8080}]
      readinessProbe:
        httpGet: {path: /health/ready, port: http}
        periodSeconds: 3
      resources:
        requests: {cpu: 25m, memory: 24Mi}
        limits: {cpu: 200m, memory: 96Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
    - name: log-helper
      image: busybox:1.37
      command: [sh, -c]
      args:
        - |
          if [ ! -f /state/crashed-once ]; then
            touch /state/crashed-once
            echo "intentional crash for --previous" >&2
            exit 42
          fi
          echo "log helper recovered after intentional crash"
          while true; do
            wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || true
            echo "log helper heartbeat $(date -Iseconds)"
            sleep 10
          done
      resources:
        requests: {cpu: 5m, memory: 4Mi}
        limits: {cpu: 25m, memory: 16Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: state, mountPath: /state}
  volumes:
    - {name: state, emptyDir: {}}
