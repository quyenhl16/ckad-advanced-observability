apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observer-demo.fullname" . }}
  labels:
    {{- include "observer-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "observer-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observer-demo.selectorLabels" . | nindent 8 }}
        lab: "5.4"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: {{ .Values.image.ref | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: HTTP_ADDR, value: ":8080"}
            - name: LAB_RELEASE_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "observer-demo.fullname" . }}
                  key: index.html
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
