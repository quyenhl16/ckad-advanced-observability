apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-backend
  namespace: ckad-labs
  labels: {app: policy-backend, lab: "4.3"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: policy-backend}
  template:
    metadata:
      labels: {app: policy-backend, role: backend, lab: "4.3"}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: ckad/traffic-ingest:local
          imagePullPolicy: IfNotPresent
          env: [{name: HTTP_ADDR, value: ":8080"}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 3
          resources:
            requests: {cpu: 25m, memory: 24Mi}
            limits: {cpu: 200m, memory: 96Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
        - name: network-probe
          image: busybox:1.37
          command: [sh, -c, 'sleep 3600']
          resources:
            requests: {cpu: 5m, memory: 4Mi}
            limits: {cpu: 25m, memory: 16Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: policy-backend
  namespace: ckad-labs
  labels: {lab: "4.3"}
spec:
  selector: {app: policy-backend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata:
  name: policy-frontend
  namespace: ckad-labs
  labels: {role: frontend, lab: "4.3"}
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: ckad/observability-frontend:local
      imagePullPolicy: IfNotPresent
      env:
        - {name: HTTP_ADDR, value: ":8081"}
        - {name: ANALYTICS_URL, value: "http://analytics-engine.advanced-observability.svc.cluster.local:8081"}
        - {name: ALERT_MANAGER_URL, value: "http://alert-manager.advanced-observability.svc.cluster.local:8082"}
      ports: [{name: http, containerPort: 8081}]
      readinessProbe:
        httpGet: {path: /health/ready, port: http}
        periodSeconds: 3
      resources:
        requests: {cpu: 25m, memory: 24Mi}
        limits: {cpu: 150m, memory: 96Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
    - name: network-probe
      image: busybox:1.37
      command: [sh, -c, 'sleep 3600']
      resources:
        requests: {cpu: 5m, memory: 4Mi}
        limits: {cpu: 25m, memory: 16Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Pod
metadata:
  name: policy-intruder
  namespace: ckad-labs
  labels: {role: intruder, lab: "4.3"}
spec:
  automountServiceAccountToken: false
  containers:
    - name: network-probe
      image: busybox:1.37
      command: [sh, -c, 'sleep 3600']
      resources:
        requests: {cpu: 5m, memory: 4Mi}
        limits: {cpu: 25m, memory: 16Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
