apiVersion: v1
kind: Pod
metadata:
  name: pvc-client
  namespace: ckad-labs
  labels: {app: pvc-client, lab: "4.4"}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: writer
      image: busybox:1.37
      command: [sh, -c, 'sleep 3600']
      resources:
        requests: {cpu: 5m, memory: 4Mi}
        limits: {cpu: 25m, memory: 16Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: day4-data}
