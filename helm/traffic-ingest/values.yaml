replicaCount: 2

image:
  repository: ckad/traffic-ingest
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

config:
  analyticsURL: http://analytics-engine:8081
  httpClientTimeout: 5s

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

podLabels:
  deployment-track: helm
