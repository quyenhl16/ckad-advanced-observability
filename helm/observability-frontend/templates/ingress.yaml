{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: advanced-observability
  labels:
    {{- include "observability-frontend.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.metricPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.trafficServiceName }}
                port:
                  number: {{ .Values.ingress.trafficServicePort }}
          - path: {{ .Values.ingress.frontendPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "observability-frontend.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
