apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability-frontend.fullname" . }}-config
  labels:
    {{- include "observability-frontend.labels" . | nindent 4 }}
data:
  ANALYTICS_URL: {{ .Values.config.analyticsURL | quote }}
  ALERT_MANAGER_URL: {{ .Values.config.alertManagerURL | quote }}
  HTTP_CLIENT_TIMEOUT: {{ .Values.config.httpClientTimeout | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability-frontend.fullname" . }}-nginx
  labels:
    {{- include "observability-frontend.labels" . | nindent 4 }}
data:
  nginx.conf.template: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {}
    http {
      access_log /var/log/shared/access.log;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen PUBLIC_PORT;
        location / {
          proxy_pass http://127.0.0.1:APP_PORT;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
