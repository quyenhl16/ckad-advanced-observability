apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability-frontend.fullname" . }}
  labels:
    {{- include "observability-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "observability-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability-frontend.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: advanced-observability
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: config-init
          image: {{ .Values.sidecars.initImage | quote }}
          command: [sh, -c, 'sed "s/PUBLIC_PORT/{{ .Values.service.port }}/g; s/APP_PORT/{{ .Values.service.appPort }}/g" /templates/nginx.conf.template > /generated/nginx.conf && touch /logs/access.log']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources.init | nindent 12 }}
          volumeMounts:
            - {name: proxy-template, mountPath: /templates, readOnly: true}
            - {name: generated-config, mountPath: /generated}
            - {name: shared-logs, mountPath: /logs}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: app-http, containerPort: {{ .Values.service.appPort }}}
          envFrom:
            - configMapRef:
                name: {{ include "observability-frontend.fullname" . }}-config
          env:
            - {name: HTTP_ADDR, value: ":{{ .Values.service.appPort }}"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          startupProbe:
            httpGet: {path: /health/live, port: app-http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /health/ready, port: app-http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: app-http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
        - name: log-sidecar
          image: {{ .Values.sidecars.logImage | quote }}
          command: [sh, -c, 'tail -n+1 -F /logs/access.log']
          resources:
            {{- toYaml .Values.resources.logSidecar | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: shared-logs, mountPath: /logs, readOnly: true}
        - name: nginx-ambassador
          image: {{ .Values.sidecars.nginxImage | quote }}
          command: [nginx, -g, "daemon off;", -c, /config/nginx.conf]
          ports:
            - {name: http, containerPort: {{ .Values.service.port }}}
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: generated-config, mountPath: /config, readOnly: true}
            - {name: shared-logs, mountPath: /var/log/shared}
            - {name: nginx-tmp, mountPath: /tmp}
      volumes:
        - name: proxy-template
          configMap:
            name: {{ include "observability-frontend.fullname" . }}-nginx
            items: [{key: nginx.conf.template, path: nginx.conf.template}]
        - {name: generated-config, emptyDir: {}}
        - {name: shared-logs, emptyDir: {}}
        - {name: nginx-tmp, emptyDir: {}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
