apiVersion: v1
kind: LimitRange
metadata:
  name: observability-container-defaults
  namespace: advanced-observability
  labels:
    app.kubernetes.io/part-of: advanced-observability
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 250m
        memory: 128Mi
      min:
        cpu: 5m
        memory: 4Mi
      max:
        cpu: "1"
        memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: advanced-observability
  labels:
    app.kubernetes.io/part-of: advanced-observability
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    persistentvolumeclaims: "4"
    requests.storage: 10Gi
